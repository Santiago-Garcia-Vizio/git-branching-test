name: auto label pr bots

on:
  pull_request:
    branches:
      - dev
jobs:
  label-auto:
    if: github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Add bot labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request }} \
          --add-label dev-sync
